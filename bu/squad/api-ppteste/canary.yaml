apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-ppteste
  namespace: producao
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-ppteste
  template:
      metadata:
        labels:
          app: api-ppteste
      spec:
        containers:
        - name: api-ppteste
          image: betapenguin/demoapp-color:red
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

  strategy:
    canary:
      steps:
      - setWeight: 10
      - pause: {} # Pausa indefinida aguardando promoção manual (ou defina duration: "10m")
      - setWeight: 50
      - pause: { duration: 1h }
      - setWeight: 100
